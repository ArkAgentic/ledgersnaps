<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LedgerSnaps Console</title>
  <link rel="icon" type="image/png" href="/assets/images/logo-transparent.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monda:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Monda','Sora',sans-serif; }
    .console-bg-light { background:#f6f7fb url('/assets/images/landing-bg-light-fast.jpg') center/cover no-repeat; }
    .console-bg-dark { background:#0b1526 linear-gradient(rgba(3,9,24,.58), rgba(3,9,24,.66)), url('/assets/images/landing-bg-dark-laser-fast.jpg') center/cover no-repeat; }
    .sidebar-surface { background: rgba(255,255,255,0.92); backdrop-filter: blur(6px); }
    .dark .sidebar-surface { background: rgba(30,41,59,0.88); }
    #main-pane { background: transparent; }
    .dark #main-pane { background: linear-gradient(rgba(2,6,23,.35), rgba(2,6,23,.35)); }

  </style>
</head>
<body class="console-bg-light text-black">
  <div class="flex min-h-screen w-full">
    <div id="shell" class="flex w-full text-black dark:text-white">
      <nav id="sidebar" class="sticky top-0 h-screen shrink-0 border-r transition-all duration-300 ease-in-out w-64 border-gray-200 dark:border-gray-800 sidebar-surface p-2 shadow-sm">
        <div class="mb-6 border-b border-gray-200 dark:border-gray-800 pb-4">
          <div class="flex items-center rounded-md p-2">
            <img src="/assets/images/logo-with-text-black.png" data-logo-light="/assets/images/logo-with-text-black.png" data-logo-dark="/assets/images/logo-with-text-white.png" alt="LedgerSnaps" class="h-8 w-auto" id="sidebar-logo" />
          </div>
        </div>

        <div class="space-y-1 mb-8" id="menu-primary">
          <button data-title="Overview" class="menu-option relative flex h-11 w-full items-center rounded-md bg-blue-50 dark:bg-slate-700/70 text-blue-700 dark:text-gray-100 shadow-sm border-l-2 border-blue-500 dark:border-slate-400">
            <div class="grid h-full w-12 place-content-center"><i data-lucide="layout-dashboard" class="h-4 w-4"></i></div><span class="menu-label text-sm font-medium">Overview</span>
          </button>
          <button data-title="Upload & Extract" class="menu-option relative flex h-11 w-full items-center rounded-md text-gray-700 dark:text-gray-100 hover:bg-gray-50 dark:hover:bg-gray-700/70"><div class="grid h-full w-12 place-content-center"><i data-lucide="upload" class="h-4 w-4"></i></div><span class="menu-label text-sm font-medium">Upload & Extract</span></button>
          <button data-title="Jobs / History" class="menu-option relative flex h-11 w-full items-center rounded-md text-gray-700 dark:text-gray-100 hover:bg-gray-50 dark:hover:bg-gray-700/70"><div class="grid h-full w-12 place-content-center"><i data-lucide="history" class="h-4 w-4"></i></div><span class="menu-label text-sm font-medium">Jobs / History</span></button>
          <button data-title="Draft Bills (Xero/MYOB)" class="menu-option relative flex h-11 w-full items-center rounded-md text-gray-700 dark:text-gray-100 hover:bg-gray-50 dark:hover:bg-gray-700/70"><div class="grid h-full w-12 place-content-center"><i data-lucide="file-check-2" class="h-4 w-4"></i></div><span class="menu-label text-sm font-medium">Draft Bills (Xero/MYOB)</span></button>
          <button data-title="Exports (Excel)" class="menu-option relative flex h-11 w-full items-center rounded-md text-gray-700 dark:text-gray-100 hover:bg-gray-50 dark:hover:bg-gray-700/70"><div class="grid h-full w-12 place-content-center"><i data-lucide="sheet" class="h-4 w-4"></i></div><span class="menu-label text-sm font-medium">Exports (Excel)</span></button>
          <button data-title="ABN/GST Validation" class="menu-option relative flex h-11 w-full items-center rounded-md text-gray-700 dark:text-gray-100 hover:bg-gray-50 dark:hover:bg-gray-700/70"><div class="grid h-full w-12 place-content-center"><i data-lucide="shield-check" class="h-4 w-4"></i></div><span class="menu-label text-sm font-medium">ABN/GST Validation</span></button>
          <button data-title="Pricing & Top-up" class="menu-option relative flex h-11 w-full items-center rounded-md text-gray-700 dark:text-gray-100 hover:bg-gray-50 dark:hover:bg-gray-700/70"><div class="grid h-full w-12 place-content-center"><i data-lucide="wallet" class="h-4 w-4"></i></div><span class="menu-label text-sm font-medium">Pricing & Top-up</span></button>
        </div>

        <div id="account-block" class="border-t border-gray-200 dark:border-gray-800 pt-4 space-y-1">
          <div id="account-title" class="menu-label px-3 py-2 text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wide">Account</div>
          <button data-title="Analytics" class="menu-option relative flex h-11 w-full items-center rounded-md text-gray-700 dark:text-gray-100 hover:bg-gray-50 dark:hover:bg-gray-700/70"><div class="grid h-full w-12 place-content-center"><i data-lucide="bar-chart-3" class="h-4 w-4"></i></div><span class="menu-label text-sm font-medium">Analytics</span></button>
          <button data-title="Settings" class="menu-option relative flex h-11 w-full items-center rounded-md text-gray-700 dark:text-gray-100 hover:bg-gray-50 dark:hover:bg-gray-700/70"><div class="grid h-full w-12 place-content-center"><i data-lucide="settings" class="h-4 w-4"></i></div><span class="menu-label text-sm font-medium">Settings</span></button>
          <button data-title="Support" class="menu-option relative flex h-11 w-full items-center rounded-md text-gray-700 dark:text-gray-100 hover:bg-gray-50 dark:hover:bg-gray-700/70"><div class="grid h-full w-12 place-content-center"><i data-lucide="circle-help" class="h-4 w-4"></i></div><span class="menu-label text-sm font-medium">Support</span></button>
        </div>

        <button id="sidebar-toggle" class="absolute bottom-0 left-0 right-0 border-t border-gray-200 dark:border-gray-800 transition-colors hover:bg-gray-50 dark:hover:bg-gray-800">
          <div class="flex items-center p-3">
            <div class="grid size-10 place-content-center"><span id="sidebar-toggle-icon" class="text-base font-semibold text-gray-600 dark:text-gray-200">«</span></div>
            <span id="sidebar-toggle-label" class="menu-label text-sm font-medium text-gray-600 dark:text-gray-300">Hide</span>
          </div>
        </button>
      </nav>

      <div id="main-pane" class="flex-1 p-6 overflow-auto text-black dark:text-white">
        <div class="flex justify-end gap-3">
          <button id="lang-toggle" class="flex h-10 w-10 items-center justify-center rounded-lg border border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-900/70 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-gray-100 transition-colors" title="Switch Language">
            <span id="lang-toggle-label" class="text-xs font-semibold leading-none">EN</span>
          </button>
          <button id="bg-toggle" class="flex h-10 w-10 items-center justify-center rounded-lg border border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-900/70 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-gray-100 transition-colors" title="Toggle Theme">
            <span id="bg-toggle-icon" class="text-sm font-semibold leading-none">☾</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const body = document.body;
      const shell = document.getElementById('shell');
      const bgToggle = document.getElementById('bg-toggle');
      const bgToggleIcon = document.getElementById('bg-toggle-icon');
      const langToggle = document.getElementById('lang-toggle');
      const langToggleLabel = document.getElementById('lang-toggle-label');
      const sidebarLogo = document.getElementById('sidebar-logo');
      const sidebar = document.getElementById('sidebar');
      const sidebarToggle = document.getElementById('sidebar-toggle');
      const sidebarToggleIcon = document.getElementById('sidebar-toggle-icon');
      const sidebarToggleLabel = document.getElementById('sidebar-toggle-label');
      const accountBlock = document.getElementById('account-block');
      const BG_KEY = 'ledgersnaps_console_bg';
      const SIDEBAR_KEY = 'ledgersnaps_console_sidebar_open';
      const LANG_KEY = 'ledgersnaps_console_lang';

      function applyTheme(mode) {
        const dark = mode === 'dark';
        body.classList.toggle('console-bg-dark', dark);
        body.classList.toggle('console-bg-light', !dark);
        shell.classList.toggle('dark', dark);
        if (bgToggleIcon) bgToggleIcon.textContent = dark ? '☀' : '☾';
        if (sidebarLogo) {
          sidebarLogo.src = dark ? sidebarLogo.getAttribute('data-logo-dark') : sidebarLogo.getAttribute('data-logo-light');
        }
        lucide.createIcons();
      }

      

      function applyLanguage(lang) {
        const zh = lang === 'zh';
        const map = zh ? {
          'Overview':'总览',
          'Upload & Extract':'上传与提取',
          'Jobs / History':'任务与历史',
          'Draft Bills (Xero/MYOB)':'草稿账单 (Xero/MYOB)',
          'Exports (Excel)':'导出 (Excel)',
          'ABN/GST Validation':'ABN/GST 校验',
          'Pricing & Top-up':'套餐与充值',
          'Analytics':'分析',
          'Settings':'设置',
          'Support':'支持',
          'Account':'账户'
        } : {
          'Overview':'Overview',
          'Upload & Extract':'Upload & Extract',
          'Jobs / History':'Jobs / History',
          'Draft Bills (Xero/MYOB)':'Draft Bills (Xero/MYOB)',
          'Exports (Excel)':'Exports (Excel)',
          'ABN/GST Validation':'ABN/GST Validation',
          'Pricing & Top-up':'Pricing & Top-up',
          'Analytics':'Analytics',
          'Settings':'Settings',
          'Support':'Support',
          'Account':'Account'
        };

        document.querySelectorAll('.menu-option').forEach((btn) => {
          const title = btn.getAttribute('data-title');
          const label = btn.querySelector('.menu-label');
          if (title && label && map[title]) label.textContent = map[title];
        });

        const accountTitle = document.getElementById('account-title');
        if (accountTitle) accountTitle.textContent = map['Account'];

        if (langToggleLabel) langToggleLabel.textContent = zh ? 'CN' : 'EN';
        localStorage.setItem(LANG_KEY, zh ? 'zh' : 'en');
      }

      function setSidebar(open) {
        sidebar.classList.toggle('w-64', open);
        sidebar.classList.toggle('w-16', !open);
        document.querySelectorAll('.menu-label').forEach(el => el.classList.toggle('hidden', !open));
        if (accountBlock) accountBlock.classList.toggle('hidden', !open);
        if (sidebarToggleLabel) sidebarToggleLabel.classList.toggle('hidden', !open);
        if (sidebarToggleIcon) {
          sidebarToggleIcon.textContent = open ? '«' : '»';
        }
        localStorage.setItem(SIDEBAR_KEY, open ? '1' : '0');
        lucide.createIcons();
      }

      applyTheme(localStorage.getItem(BG_KEY) === 'dark' ? 'dark' : 'light');
      setSidebar(localStorage.getItem(SIDEBAR_KEY) !== '0');
      applyLanguage(localStorage.getItem(LANG_KEY) === 'zh' ? 'zh' : 'en');

      if (bgToggle) {
        bgToggle.addEventListener('click', () => {
          const next = body.classList.contains('console-bg-dark') ? 'light' : 'dark';
          localStorage.setItem(BG_KEY, next);
          applyTheme(next);
        });
      }
      if (sidebarToggle) {
        sidebarToggle.addEventListener('click', () => setSidebar(!sidebar.classList.contains('w-64')));
      }
      if (langToggle) {
        langToggle.addEventListener('click', () => {
          const next = (localStorage.getItem(LANG_KEY) === 'zh') ? 'en' : 'zh';
          applyLanguage(next);
        });
      }

      document.querySelectorAll('.menu-option').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.menu-option').forEach((other) => {
            other.classList.remove('bg-blue-50','dark:bg-slate-700/70','text-blue-700','dark:text-gray-100','shadow-sm','border-l-2','border-blue-500','dark:border-slate-400');
            other.classList.add('text-gray-600','dark:text-gray-400');
          });
          btn.classList.add('bg-blue-50','dark:bg-slate-700/70','text-blue-700','dark:text-gray-100','shadow-sm','border-l-2','border-blue-500','dark:border-slate-400');
          btn.classList.remove('text-gray-600','dark:text-gray-400');
        });
      });
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LedgerSnaps Console</title>
  <link rel="icon" type="image/png" href="/assets/images/logo-transparent.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monda:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Monda','Sora',sans-serif; }
    .console-bg-light { background:#f6f7fb url('/assets/images/landing-bg-light-fast.jpg') center/cover no-repeat; }
    .sidebar-surface { background: transparent; }
    #main-pane { background: transparent; }
    
    body.console-bg-light #sidebar {
      background: linear-gradient(rgba(246,247,251,.10), rgba(246,247,251,.10)), url('/assets/images/landing-bg-light-fast.jpg');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      backdrop-filter: none;
    }

    body.console-bg-light #main-pane {
      background: linear-gradient(rgba(246,247,251,.10), rgba(246,247,251,.10)), url('/assets/images/landing-bg-light-fast.jpg');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
    }

  </style>
</head>
<body class="console-bg-light text-black">
  <div class="flex min-h-screen w-full">
    <div id="shell" class="flex w-full text-black">
      <nav id="sidebar" class="sticky top-0 h-screen shrink-0 border-r transition-all duration-300 ease-in-out w-64 border-gray-200 sidebar-surface p-2 shadow-sm">
        <div class="mb-6 border-b border-gray-200 pb-4">
          <div class="flex items-center justify-center rounded-md p-2">
            <img src="/assets/images/logo-with-text-black.png" data-logo-light="/assets/images/logo-with-text-black.png" data-logo-dark="/assets/images/logo-with-text-white.png" alt="LedgerSnaps" class="h-10 w-auto" id="sidebar-logo" />
          </div>
        </div>

        <div class="space-y-1 mb-8" id="menu-primary">
          <button data-title="Overview" class="menu-option relative flex h-11 w-full items-center rounded-md bg-blue-50 text-blue-700 shadow-sm border-l-2 border-blue-500">
            <div class="grid h-full w-12 place-content-center"><i data-lucide="layout-dashboard" class="h-4 w-4"></i></div><span class="menu-label text-sm font-medium">Overview</span>
          </button>
          <button data-title="Upload & Extract" class="menu-option relative flex h-11 w-full items-center rounded-md text-gray-700 hover:bg-gray-50"><div class="grid h-full w-12 place-content-center"><i data-lucide="upload" class="h-4 w-4"></i></div><span class="menu-label text-sm font-medium">Upload & Extract</span></button>
          <button data-title="Jobs / History" class="menu-option relative flex h-11 w-full items-center rounded-md text-gray-700 hover:bg-gray-50"><div class="grid h-full w-12 place-content-center"><i data-lucide="history" class="h-4 w-4"></i></div><span class="menu-label text-sm font-medium">Jobs / History</span></button>
          <button data-title="Draft Bills (Xero/MYOB)" class="menu-option relative flex h-11 w-full items-center rounded-md text-gray-700 hover:bg-gray-50"><div class="grid h-full w-12 place-content-center"><i data-lucide="file-check-2" class="h-4 w-4"></i></div><span class="menu-label text-sm font-medium">Draft Bills (Xero/MYOB)</span></button>
          <button data-title="Exports (Excel)" class="menu-option relative flex h-11 w-full items-center rounded-md text-gray-700 hover:bg-gray-50"><div class="grid h-full w-12 place-content-center"><i data-lucide="sheet" class="h-4 w-4"></i></div><span class="menu-label text-sm font-medium">Exports (Excel)</span></button>
          <button data-title="ABN/GST Validation" class="menu-option relative flex h-11 w-full items-center rounded-md text-gray-700 hover:bg-gray-50"><div class="grid h-full w-12 place-content-center"><i data-lucide="shield-check" class="h-4 w-4"></i></div><span class="menu-label text-sm font-medium">ABN/GST Validation</span></button>
          <button data-title="Pricing & Top-up" class="menu-option relative flex h-11 w-full items-center rounded-md text-gray-700 hover:bg-gray-50"><div class="grid h-full w-12 place-content-center"><i data-lucide="wallet" class="h-4 w-4"></i></div><span class="menu-label text-sm font-medium">Pricing & Top-up</span></button>
        </div>

        <div id="account-block" class="border-t border-gray-200 pt-4 space-y-1">
          <div id="account-title" class="menu-label px-3 py-2 text-xs font-medium text-gray-500 uppercase tracking-wide">Account</div>
          <button data-title="Analytics" class="menu-option relative flex h-11 w-full items-center rounded-md text-gray-700 hover:bg-gray-50"><div class="grid h-full w-12 place-content-center"><i data-lucide="bar-chart-3" class="h-4 w-4"></i></div><span class="menu-label text-sm font-medium">Analytics</span></button>
          <button data-title="Settings" class="menu-option relative flex h-11 w-full items-center rounded-md text-gray-700 hover:bg-gray-50"><div class="grid h-full w-12 place-content-center"><i data-lucide="settings" class="h-4 w-4"></i></div><span class="menu-label text-sm font-medium">Settings</span></button>
          <button data-title="Support" class="menu-option relative flex h-11 w-full items-center rounded-md text-gray-700 hover:bg-gray-50"><div class="grid h-full w-12 place-content-center"><i data-lucide="circle-help" class="h-4 w-4"></i></div><span class="menu-label text-sm font-medium">Support</span></button>
        </div>

        <a href="/" id="signout-link" class="absolute bottom-0 left-0 right-0 border-t border-gray-200 transition-colors hover:bg-gray-50">
          <div class="flex items-center p-3">
            <div class="grid size-10 place-content-center"><i data-lucide="log-out" class="h-4 w-4 text-gray-600"></i></div>
            <span id="signout-label" class="menu-label text-sm font-medium text-gray-600">Sign Out</span>
          </div>
        </a>
      </nav>

      <div id="main-pane" class="flex-1 p-6 overflow-auto text-black">
        <div class="flex items-center justify-between mb-8">
          <div>
            <h1 id="overview-title" class="text-3xl font-bold text-gray-900">Overview</h1>
            <p id="overview-subtitle" class="text-gray-600 mt-1">Account status, AI quota, and integration readiness.</p>
          </div>
          <div class="flex justify-end gap-3">
            <button id="lang-toggle" class="flex h-10 w-10 items-center justify-center rounded-lg border border-gray-200 bg-white/80 text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors" title="Switch Language">
              <span id="lang-toggle-label" class="text-xs font-semibold leading-none">EN</span>
            </button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
          <div class="p-6 rounded-xl border border-gray-200 bg-white shadow-sm hover:shadow-md transition-shadow">
            <div class="flex items-center justify-between mb-4">
              <div class="p-2 bg-blue-50 rounded-lg"><i data-lucide="badge-check" class="h-5 w-5 text-blue-600"></i></div>
            </div>
            <h3 id="kpi-plan-title" class="font-medium text-gray-600 mb-1">Current Plan</h3>
            <p id="kpi-plan" class="text-2xl font-bold text-gray-900">-</p>
            <p id="kpi-plan-sub" class="text-sm text-gray-500 mt-1">-</p>
          </div>

          <div class="p-6 rounded-xl border border-gray-200 bg-white shadow-sm hover:shadow-md transition-shadow">
            <div class="flex items-center justify-between mb-4">
              <div class="p-2 bg-green-50 rounded-lg"><i data-lucide="sparkles" class="h-5 w-5 text-green-600"></i></div>
            </div>
            <h3 id="kpi-ai-title" class="font-medium text-gray-600 mb-1">AI Extraction Remaining</h3>
            <p id="kpi-ai-remaining" class="text-2xl font-bold text-gray-900">-</p>
            <p id="kpi-ai-sub" class="text-sm text-gray-500 mt-1">-</p>
          </div>

          <div class="p-6 rounded-xl border border-gray-200 bg-white shadow-sm hover:shadow-md transition-shadow">
            <div class="flex items-center justify-between mb-4">
              <div class="p-2 bg-purple-50 rounded-lg"><i data-lucide="link" class="h-5 w-5 text-purple-600"></i></div>
            </div>
            <h3 id="kpi-xero-title" class="font-medium text-gray-600 mb-1">Xero Connection</h3>
            <p id="kpi-xero" class="text-2xl font-bold text-gray-900">-</p>
            <p id="kpi-xero-sub" class="text-sm text-gray-500 mt-1">-</p>
          </div>

          <div class="p-6 rounded-xl border border-gray-200 bg-white shadow-sm hover:shadow-md transition-shadow">
            <div class="flex items-center justify-between mb-4">
              <div class="p-2 bg-orange-50 rounded-lg"><i data-lucide="database" class="h-5 w-5 text-orange-600"></i></div>
            </div>
            <h3 id="kpi-jobs-title" class="font-medium text-gray-600 mb-1">Jobs</h3>
            <p id="kpi-jobs" class="text-2xl font-bold text-gray-900">-</p>
            <p id="kpi-jobs-sub" class="text-sm text-gray-500 mt-1">-</p>
          </div>
        </div>

        <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm mb-8">
          <div class="flex items-center justify-between mb-4">
            <h3 id="quota-title" class="text-lg font-semibold text-gray-900">Quota Breakdown</h3>
            <span id="quota-total" class="text-sm text-gray-600">-</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="rounded-lg border border-gray-200 p-4">
              <div id="trial-label" class="text-xs uppercase tracking-wide text-gray-500 mb-1">Trial</div>
              <div id="trial-row" class="text-sm text-gray-700">-</div>
            </div>
            <div class="rounded-lg border border-gray-200 p-4">
              <div id="plan-label" class="text-xs uppercase tracking-wide text-gray-500 mb-1">Plan</div>
              <div id="plan-row" class="text-sm text-gray-700">-</div>
            </div>
            <div class="rounded-lg border border-gray-200 p-4">
              <div id="topup-label" class="text-xs uppercase tracking-wide text-gray-500 mb-1">Top-up</div>
              <div id="topup-row" class="text-sm text-gray-700">-</div>
            </div>
          </div>
        </div>

        <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
          <div class="flex items-center justify-between mb-4">
            <h3 id="recent-title" class="text-lg font-semibold text-gray-900">Recent Jobs</h3>
            <span id="recent-count" class="text-sm text-gray-500">-</span>
          </div>
          <div id="recent-jobs" class="space-y-3 text-sm text-gray-700">
            <div class="text-gray-500">Loading...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const body = document.body;
      const shell = document.getElementById('shell');
      const langToggle = document.getElementById('lang-toggle');
      const langToggleLabel = document.getElementById('lang-toggle-label');
      const sidebarLogo = document.getElementById('sidebar-logo');
      const signoutLabel = document.getElementById('signout-label');
      const LANG_KEY = 'ledgersnaps_console_lang';

      function authHeaders() {
        const token = localStorage.getItem('authToken') || localStorage.getItem('token') || '';
        return token ? { 'Authorization': `Bearer ${token}` } : {};
      }

      function text(id, value) {
        const el = document.getElementById(id);
        if (el) el.textContent = value;
      }

      function humanPlan(planId) {
        if (planId === 'starter_14_95') return 'Starter';
        if (planId === 'pro_29_95') return 'Pro';
        if (planId === 'none') return 'Trial';
        return planId || '-';
      }

      async function loadOverview() {
        try {
          const [billingRes, xeroRes, jobsRes] = await Promise.all([
            fetch('/api/v1/billing/me', { headers: authHeaders() }),
            fetch('/api/v1/xero/connection', { headers: authHeaders() }),
            fetch('/api/v1/jobs', { headers: authHeaders() }),
          ]);

          const billing = billingRes.ok ? await billingRes.json() : null;
          const xero = xeroRes.ok ? await xeroRes.json() : null;
          const jobs = jobsRes.ok ? await jobsRes.json() : null;

          if (billing && billing.account) {
            const a = billing.account;
            const trial = a.trial || {};
            const plan = a.plan || {};
            const top = a.topup || {};
            text('kpi-plan', humanPlan(a.plan_id));
            text('kpi-plan-sub', a.plan_id === 'none' ? `Trial ends: ${String(trial.ends_at || '-').slice(0,10)}` : `Monthly quota: ${plan.invoice_limit || 0}`);
            text('kpi-ai-remaining', String(a.remaining_invoices ?? 0));
            text('kpi-ai-sub', `Trial ${trial.remaining_invoices || 0} · Plan ${plan.remaining_invoices || 0} · Top-up ${top.remaining_invoices || 0}`);
            text('quota-total', `Total remaining: ${a.remaining_invoices || 0}`);
            text('trial-row', `${trial.used_invoices || 0} used / ${trial.invoice_limit || 0} · ${trial.remaining_invoices || 0} left`);
            text('plan-row', `${plan.used_invoices || 0} used / ${plan.invoice_limit || 0} · ${plan.remaining_invoices || 0} left`);
            text('topup-row', `${top.used_invoices || 0} used / ${top.total_invoices || 0} · ${top.remaining_invoices || 0} left`);
          }

          if (xero) {
            const connected = !!xero.connected;
            text('kpi-xero', connected ? 'Connected' : 'Not Connected');
            const tenant = xero.active_tenant_name || xero.active_tenant_id || '-';
            text('kpi-xero-sub', connected ? tenant : 'Authorize required');
          }

          if (jobs) {
            const list = Array.isArray(jobs.jobs) ? jobs.jobs : [];
            text('kpi-jobs', String(list.length));
            const processing = list.filter(j => (j.status || '').toLowerCase() === 'processing').length;
            text('kpi-jobs-sub', `${processing} processing`);
            text('recent-count', `${list.length} total`);
            const container = document.getElementById('recent-jobs');
            if (container) {
              if (!list.length) {
                container.innerHTML = '<div class="text-gray-500">No jobs yet</div>';
              } else {
                container.innerHTML = list.slice(0,5).map(j => {
                  const status = (j.status || '-').toUpperCase();
                  const t = String(j.updated_at || j.created_at || '').slice(0,19).replace('T',' ');
                  const fc = j.file_count || 0;
                  const ie = j.invoice_estimated || 0;
                  return `<div class="flex items-center justify-between rounded-lg border border-gray-200 p-3"><div><div class="font-medium text-gray-800">${j.job_id}</div><div class="text-xs text-gray-500">files ${fc} · invoices est ${ie}</div></div><div class="text-right"><div class="text-xs font-semibold text-gray-700">${status}</div><div class="text-xs text-gray-500">${t}</div></div></div>`;
                }).join('');
              }
            }
          }
        } catch (e) {
          text('kpi-plan-sub', 'Failed to load live data');
          const container = document.getElementById('recent-jobs');
          if (container) container.innerHTML = '<div class="text-red-500">Failed to load jobs</div>';
        }
      }

      function applyTheme() {
        body.classList.remove('console-bg-dark');
        body.classList.add('console-bg-light');
        shell.classList.remove('dark');
        if (sidebarLogo) sidebarLogo.src = sidebarLogo.getAttribute('data-logo-light');
        lucide.createIcons();
      }
      function applyLanguage(lang) {
        const zh = lang === 'zh';
        const map = zh ? {
          'Overview':'总览',
          'Upload & Extract':'上传与提取',
          'Jobs / History':'任务与历史',
          'Draft Bills (Xero/MYOB)':'草稿账单 (Xero/MYOB)',
          'Exports (Excel)':'导出 (Excel)',
          'ABN/GST Validation':'ABN/GST 校验',
          'Pricing & Top-up':'套餐与充值',
          'Analytics':'分析',
          'Settings':'设置',
          'Support':'支持',
          'Account':'账户',
          'Sign Out':'登出',
          'Overview subtitle':'账户状态、AI额度与集成准备情况',
          'Current Plan':'账户级别',
          'AI Extraction Remaining':'AI提取剩余额度',
          'Xero Connection':'Xero 连接状态',
          'Jobs':'任务总览',
          'Quota Breakdown':'额度拆分',
          'Trial':'试用',
          'Plan':'套餐',
          'Top-up':'充值包',
          'Recent Jobs':'最近任务'
        } : {
          'Overview':'Overview',
          'Upload & Extract':'Upload & Extract',
          'Jobs / History':'Jobs / History',
          'Draft Bills (Xero/MYOB)':'Draft Bills (Xero/MYOB)',
          'Exports (Excel)':'Exports (Excel)',
          'ABN/GST Validation':'ABN/GST Validation',
          'Pricing & Top-up':'Pricing & Top-up',
          'Analytics':'Analytics',
          'Settings':'Settings',
          'Support':'Support',
          'Account':'Account',
          'Sign Out':'Sign Out',
          'Overview subtitle':'Account status, AI quota, and integration readiness.',
          'Current Plan':'Current Plan',
          'AI Extraction Remaining':'AI Extraction Remaining',
          'Xero Connection':'Xero Connection',
          'Jobs':'Jobs',
          'Quota Breakdown':'Quota Breakdown',
          'Trial':'Trial',
          'Plan':'Plan',
          'Top-up':'Top-up',
          'Recent Jobs':'Recent Jobs'
        };

        document.querySelectorAll('.menu-option').forEach((btn) => {
          const title = btn.getAttribute('data-title');
          const label = btn.querySelector('.menu-label');
          if (title && label && map[title]) label.textContent = map[title];
        });

        const accountTitle = document.getElementById('account-title');
        if (accountTitle) accountTitle.textContent = map['Account'];

        if (langToggleLabel) langToggleLabel.textContent = zh ? 'EN' : 'CN';
        if (signoutLabel) signoutLabel.textContent = map['Sign Out'];
        text('overview-title', map['Overview']);
        text('overview-subtitle', map['Overview subtitle']);
        text('kpi-plan-title', map['Current Plan']);
        text('kpi-ai-title', map['AI Extraction Remaining']);
        text('kpi-xero-title', map['Xero Connection']);
        text('kpi-jobs-title', map['Jobs']);
        text('quota-title', map['Quota Breakdown']);
        text('trial-label', map['Trial']);
        text('plan-label', map['Plan']);
        text('topup-label', map['Top-up']);
        text('recent-title', map['Recent Jobs']);

        localStorage.setItem(LANG_KEY, zh ? 'zh' : 'en');
      }


      applyTheme();
      applyLanguage(localStorage.getItem(LANG_KEY) === 'zh' ? 'zh' : 'en');
      loadOverview();
      if (langToggle) {
        langToggle.addEventListener('click', () => {
          const next = (localStorage.getItem(LANG_KEY) === 'zh') ? 'en' : 'zh';
          applyLanguage(next);
        });
      }

      document.querySelectorAll('.menu-option').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.menu-option').forEach((other) => {
            other.classList.remove('bg-blue-50','text-blue-700','shadow-sm','border-l-2','border-blue-500');
            other.classList.add('text-gray-600');
          });
          btn.classList.add('bg-blue-50','text-blue-700','shadow-sm','border-l-2','border-blue-500');
          btn.classList.remove('text-gray-600');
        });
      });
    })();
  </script>
</body>
</html>
